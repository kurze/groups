openapi: 3.0.3
info:
  title: Password Reset Request API
  description: Request a password reset link via email
  version: 1.0.0

paths:
  /api/auth/password-reset/request:
    post:
      summary: Request password reset
      description: |
        Request a password reset link. Always returns success to prevent user enumeration.
        If the email exists, a reset link is sent. If not, no email is sent but response is identical.
        Response time is constant regardless of whether user exists (timing attack prevention).
      operationId: requestPasswordReset
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: "user@example.com"
                  description: Email address of the account to reset
            examples:
              valid:
                summary: Valid email format
                value:
                  email: "alice@example.com"
              invalid_format:
                summary: Invalid email format (returns 400)
                value:
                  email: "not-an-email"
      responses:
        '200':
          description: |
            Success response (always returned, even if email doesn't exist).
            Generic message prevents user enumeration.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: "If this email exists in our system, a password reset link has been sent."
        '400':
          description: Bad request (invalid email format)
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "Invalid email format"
        '429':
          description: Too many requests (rate limited)
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - retry_after_seconds
                properties:
                  error:
                    type: string
                    example: "Too many password reset requests. Please try again later."
                  retry_after_seconds:
                    type: integer
                    example: 1800
                    description: Seconds until next request is allowed (30 minutes)
      security: []  # Public endpoint, no authentication required

components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
