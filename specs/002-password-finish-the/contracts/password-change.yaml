openapi: 3.0.3
info:
  title: Password Change API
  description: Change password for authenticated user
  version: 1.0.0

paths:
  /api/auth/password/change:
    post:
      summary: Change password for authenticated user
      description: |
        Change password while logged in. Requires current password for verification.
        On success, all OTHER sessions are invalidated (current session remains active).
        User receives email notification of password change.
      operationId: changePassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  example: "old-password-here"
                  description: Current password for verification
                new_password:
                  type: string
                  minLength: 1
                  maxLength: 128
                  example: "new-secure-passphrase-2024"
                  description: |
                    New password. Must pass zxcvbn strength validation (score >= 3).
                    Cannot be the same as current password.
            examples:
              valid:
                summary: Valid password change
                value:
                  current_password: "my-old-password"
                  new_password: "my-new-super-secure-passphrase"
              weak_new_password:
                summary: New password too weak (returns 400)
                value:
                  current_password: "my-old-password"
                  new_password: "password123"
              wrong_current_password:
                summary: Wrong current password (returns 401)
                value:
                  current_password: "wrong-password"
                  new_password: "my-new-super-secure-passphrase"
      responses:
        '200':
          description: Password successfully changed
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: "Password changed successfully. All other sessions have been logged out."
        '400':
          description: Invalid request (weak new password, same as current, or missing fields)
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "New password is too weak"
                  feedback:
                    type: object
                    description: Password strength feedback from zxcvbn (if applicable)
                    properties:
                      score:
                        type: integer
                        minimum: 0
                        maximum: 4
                        example: 1
                      warning:
                        type: string
                        example: "This password is too similar to your email"
                      suggestions:
                        type: array
                        items:
                          type: string
                        example:
                          - "Use a longer passphrase"
                          - "Avoid personal information"
        '401':
          description: Unauthorized (not logged in or wrong current password)
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: "Current password is incorrect"
        '429':
          description: Too many password change attempts (rate limited)
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - retry_after_seconds
                properties:
                  error:
                    type: string
                    example: "Too many password change attempts. Please try again later."
                  retry_after_seconds:
                    type: integer
                    example: 300
                    description: Seconds until next attempt is allowed
      security:
        - sessionCookie: []  # Requires active session

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: groups_session
      description: Session cookie from login

  schemas:
    PasswordFeedback:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 4
        warning:
          type: string
        suggestions:
          type: array
          items:
            type: string
